[package]
name = "rapcoding"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Low-latency push-to-talk voice input for code and prompts (local Vosk ASR)"
license = "MIT"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:ureq", "dep:zip", "dep:image"]

[dependencies]
arboard = { version = "3.7", default-features = false }
cpal = "0.18"
crossbeam-channel = "0.5"
eframe = { version = "0.32", optional = true }
enigo = "0.6"
global-hotkey = "0.9"
image = { version = "0.25", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
ureq = { version = "2", optional = true }
vosk = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
